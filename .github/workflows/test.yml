name: Test Planif
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Tests (${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz: [Europe/Paris, America/Los_Angeles, Pacific/Auckland]
    # All three zones are blocking since timezone-independent saved-plan dates (#3).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run tests
        run: node --test tests/*.test.cjs
        env:
          TZ: ${{ matrix.tz }}
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install development tools
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
  audits:
    name: Planning audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The audits rebuild historical engines from Git.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Planning, personal-load and block-load audits
        run: npm run audit
  verify-live:
    name: Verify live files
    needs: [test, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm run verify-live
