name: Test Planif
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JavaScript syntax
        run: node scripts/check-syntax.cjs
      - name: Run tests
        run: TZ=Europe/Paris node --test tests/*.test.cjs
      - name: Verify live files
        if: github.event_name == 'push'
        run: node scripts/verify-live.cjs
